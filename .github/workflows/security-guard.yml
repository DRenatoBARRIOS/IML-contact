name: IML security guard

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/192_security_layer.sql"
      - "db/migrations/193_security_access_controls.sql"
      - "db/migrations/196_security_data_export_controls.sql"
      - "db/migrations/197_security_crypto_envelopes.sql"
      - "src/security/**"
      - "tests/security-*.test.mjs"
      - "docs/IML_SECURITY_01_IMPLEMENTATION.md"
      - ".github/workflows/security-guard.yml"
  push:
    branches:
      - "feat/iml-security-layer"
    paths:
      - "db/migrations/192_security_layer.sql"
      - "db/migrations/193_security_access_controls.sql"
      - "db/migrations/196_security_data_export_controls.sql"
      - "db/migrations/197_security_crypto_envelopes.sql"
      - "src/security/**"
      - "tests/security-*.test.mjs"
      - "docs/IML_SECURITY_01_IMPLEMENTATION.md"
      - ".github/workflows/security-guard.yml"

permissions:
  contents: read

jobs:
  security-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: node --test tests/security-*.test.mjs

      - name: Verify security migrations remain additive
        shell: bash
        run: |
          set -euo pipefail
          for migration in             db/migrations/192_security_layer.sql             db/migrations/193_security_access_controls.sql             db/migrations/196_security_data_export_controls.sql             db/migrations/197_security_crypto_envelopes.sql
          do
            if grep -Eiq '^[[:space:]]*(DROP[[:space:]]+(TABLE|SCHEMA)|TRUNCATE|ALTER[[:space:]]+(TABLE|SCHEMA)[[:space:]]+iml_(clinical|identity|terminology|laboratory))' "$migration"; then
              echo "$migration contains a destructive change to an existing IML functional schema."
              exit 1
            fi
          done

      - name: Verify core security invariants are tested
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AI DENY_FINAL is terminal" tests/security-policy.test.mjs
          grep -q "AI cannot create a break-glass grant" tests/security-access-matrix.test.mjs
          grep -q "restricted identity cannot pass through generic export" tests/security-export-gateway.test.mjs
          grep -q "sensitive export without encryption never reaches delivery" tests/security-export-gateway.test.mjs
          grep -q "ciphertext cannot be moved to another patient context" tests/security-crypto-envelope.test.mjs
          grep -q "KEK rotation re-wraps DEK without changing clinical ciphertext" tests/security-crypto-envelope.test.mjs
