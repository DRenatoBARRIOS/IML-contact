name: IML security database integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "db/migrations/192_security_layer.sql"
      - "db/migrations/193_security_access_controls.sql"
      - "db/migrations/196_security_data_export_controls.sql"
      - "db/migrations/197_security_crypto_envelopes.sql"
      - ".github/workflows/security-db-integration.yml"
  push:
    branches:
      - "feat/iml-security-layer"
    paths:
      - "db/migrations/192_security_layer.sql"
      - "db/migrations/193_security_access_controls.sql"
      - "db/migrations/196_security_data_export_controls.sql"
      - "db/migrations/197_security_crypto_envelopes.sql"
      - ".github/workflows/security-db-integration.yml"

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iml_test
          POSTGRES_PASSWORD: iml_test
          POSTGRES_DB: iml_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iml_test -d iml_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: iml_test
      PGPASSWORD: iml_test
      PGDATABASE: iml_security_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create minimal IML system fixture
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA iml_system;

          CREATE TABLE iml_system.module_registry (
            code text PRIMARY KEY,
            name text NOT NULL,
            category text NOT NULL,
            status text NOT NULL,
            version text NOT NULL,
            description text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL

      - name: Apply SECURITY migrations in canonical order
        shell: bash
        run: |
          set -euo pipefail
          for migration in             db/migrations/192_security_layer.sql             db/migrations/193_security_access_controls.sql             db/migrations/196_security_data_export_controls.sql             db/migrations/197_security_crypto_envelopes.sql
          do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Exercise audit append and append-only protection
        shell: bash
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT iml_security.append_audit_event(
            'human',
            '11111111-1111-4111-8111-111111111111'::uuid,
            'security_test',
            'security_fixture',
            'fixture-a',
            'completed',
            'security_validation',
            '22222222-2222-4222-8222-222222222222'::uuid,
            '{"source":"ci"}'::jsonb,
            NULL
          );

          DO $$
          BEGIN
            IF (SELECT count(*) FROM iml_security.audit_event) <> 1 THEN
              RAISE EXCEPTION 'audit append assertion failed';
            END IF;
          END
          $$;
          SQL

          if psql -v ON_ERROR_STOP=1 -c             "UPDATE iml_security.audit_event SET outcome='tampered' WHERE seq=1;"             >/tmp/iml-audit-update.out 2>&1
          then
            echo "audit_event mutation unexpectedly succeeded"
            cat /tmp/iml-audit-update.out
            exit 1
          fi

      - name: Exercise role and emergency constraints
        shell: bash
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM iml_security.role_definition) <> 6 THEN
              RAISE EXCEPTION 'canonical role count assertion failed';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM iml_security.role_definition
              WHERE principal_class <> 'human'
                AND can_request_break_glass
            ) THEN
              RAISE EXCEPTION 'non-human break-glass role detected';
            END IF;
          END
          $$;
          SQL

          if psql -v ON_ERROR_STOP=1 <<'SQL' >/tmp/iml-breakglass.out 2>&1
          INSERT INTO iml_security.emergency_access_grant (
            requested_by,
            subject_ref,
            justification,
            step_up_auth_method,
            step_up_authenticated_at,
            activated_at,
            expires_at
          )
          VALUES (
            '11111111-1111-4111-8111-111111111111'::uuid,
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,
            'Emergency chart review required now',
            'test-mfa',
            clock_timestamp(),
            clock_timestamp(),
            clock_timestamp() + interval '31 minutes'
          );
          SQL
          then
            echo "break-glass duration above 30 minutes unexpectedly succeeded"
            exit 1
          fi

      - name: Exercise export gateway database constraints
        shell: bash
        run: |
          set -euo pipefail

          if psql -v ON_ERROR_STOP=1 <<'SQL' >/tmp/iml-export.out 2>&1
          INSERT INTO iml_security.export_authorization (
            requested_by,
            purpose_of_use,
            resource_scope,
            requested_format,
            max_records,
            destination_class,
            status,
            allowed_classifications,
            field_allowlist,
            requires_encryption,
            policy_version
          )
          VALUES (
            '11111111-1111-4111-8111-111111111111'::uuid,
            'security_validation',
            '{"fixture":true}'::jsonb,
            'json',
            10,
            'controlled',
            'approved',
            ARRAY['HEALTH'],
            ARRAY[]::text[],
            true,
            'IML-SECURITY-03/0.3.0'
          );
          SQL
          then
            echo "approved export without field allowlist unexpectedly succeeded"
            exit 1
          fi

      - name: Exercise crypto-envelope metadata
        shell: bash
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO iml_security.key_reference (
            id,
            key_purpose,
            provider,
            provider_key_ref,
            algorithm,
            key_version,
            provider_class,
            rotation_group,
            capabilities
          )
          VALUES (
            '33333333-3333-4333-8333-333333333333'::uuid,
            'clinical',
            'TEST_ONLY',
            'test://clinical-kek',
            'AES-KW-256',
            '1',
            'test',
            'clinical-test',
            '{"wrap":true,"unwrap":true,"rewrap":true}'::jsonb
          );

          INSERT INTO iml_security.crypto_envelope (
            resource_type,
            resource_ref,
            field_ref,
            classification_code,
            key_reference_id,
            key_purpose,
            nonce,
            wrapped_dek,
            wrap_algorithm,
            aad_hash,
            ciphertext_hash
          )
          VALUES (
            'clinical_record',
            'opaque-subject-a',
            'diagnostic_summary',
            'HEALTH',
            '33333333-3333-4333-8333-333333333333'::uuid,
            'clinical',
            decode('000102030405060708090a0b', 'hex'),
            decode('00112233445566778899aabbccddeeff', 'hex'),
            'AES-KW-256',
            repeat('a', 64),
            repeat('b', 64)
          );

          DO $$
          BEGIN
            IF (SELECT count(*) FROM iml_security.crypto_envelope) <> 1 THEN
              RAISE EXCEPTION 'crypto envelope fixture assertion failed';
            END IF;
          END
          $$;
          SQL

      - name: Verify module registry advanced to SECURITY-04
        shell: bash
        run: |
          set -euo pipefail
          version="$(psql -v ON_ERROR_STOP=1 -Atc "SELECT version FROM iml_system.module_registry WHERE code = 'SECURITY_LAYER';")"
          test "$version" = "IML-SECURITY-01/0.4.0"


      - name: Validate consolidated Neon maquette bundle in fresh database
        shell: bash
        run: |
          set -euo pipefail

          createdb iml_security_bundle_test

          PGDATABASE=iml_security_bundle_test psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA iml_system;

          CREATE TABLE iml_system.module_registry (
            code text PRIMARY KEY,
            name text NOT NULL,
            category text NOT NULL,
            status text NOT NULL,
            version text NOT NULL,
            description text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL

          PGDATABASE=iml_security_bundle_test psql -v ON_ERROR_STOP=1             -f db/neon/IML_SECURITY_MAQUETTE_v0_4.sql

          PGDATABASE=iml_security_bundle_test psql -v ON_ERROR_STOP=1             -f db/tests/security_neon_maquette_assertions.sql
