name: Cleanup generated artifacts main-test

on:
  push:
    branches:
      - main-test
    paths:
      - .github/workflows/cleanup-generated-artifacts-main-test.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run generated artifact cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-test
        uses: actions/checkout@v4
        with:
          ref: main-test
          fetch-depth: 0

      - name: Remove generated artifacts and protect repository
        shell: bash
        run: |
          rm -rf dist node_modules
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .env
          .env.*
          !.env.example
          .DS_Store
          EOF
          rm .github/workflows/cleanup-generated-artifacts-main-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean generated build artifacts"
          git push origin main-test
