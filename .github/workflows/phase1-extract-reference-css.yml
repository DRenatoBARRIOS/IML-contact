name: Phase 1 extract App CSS

on:
  push:
    branches:
      - main-test
    paths:
      - .github/workflows/phase1-extract-reference-css.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message == 'Phase 1 CSS extraction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-test
        uses: actions/checkout@v4
        with:
          ref: main-test

      - name: Move REFERENCE_ADJUSTMENTS into visual-system.css
        shell: python
        run: |
          from pathlib import Path

          app_path = Path('src/App.jsx')
          css_path = Path('src/visual-system.css')
          workflow_path = Path('.github/workflows/phase1-extract-reference-css.yml')

          app = app_path.read_text(encoding='utf-8')
          visual = css_path.read_text(encoding='utf-8')

          start_marker = 'const REFERENCE_ADJUSTMENTS = `'
          home_marker = 'function HomePage()'
          comment_marker = '/*\n * These few rules are deliberately kept here so this App.jsx can replace the'

          if start_marker not in app:
              raise SystemExit('REFERENCE_ADJUSTMENTS block not found')

          constant_start = app.index(start_marker)
          css_start = constant_start + len(start_marker)
          css_end = app.index('\n`;', css_start)
          css_block = app[css_start:css_end].replace('\\"', '"').strip()

          block_start = app.rfind(comment_marker, 0, constant_start)
          if block_start == -1:
              block_start = constant_start

          block_end = app.index(home_marker, css_end)
          app = app[:block_start].rstrip() + '\n\n' + app[block_end:]

          style_line = '      <style>{REFERENCE_ADJUSTMENTS}</style>\n'
          if style_line not in app:
              raise SystemExit('REFERENCE_ADJUSTMENTS style tag not found')
          app = app.replace(style_line, '', 1)

          section_header = '/* Extracted from App.jsx: REFERENCE_ADJUSTMENTS */'
          if section_header in visual:
              raise SystemExit('Extracted CSS section already exists')

          visual = visual.rstrip() + '\n\n' + section_header + '\n' + css_block + '\n'

          if 'REFERENCE_ADJUSTMENTS' in app:
              raise SystemExit('REFERENCE_ADJUSTMENTS still present in App.jsx')

          app_path.write_text(app, encoding='utf-8')
          css_path.write_text(visual, encoding='utf-8')
          workflow_path.unlink()

      - name: Commit extracted CSS
        run: |
          git config user.name "IML refactor bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/visual-system.css .github/workflows/phase1-extract-reference-css.yml
          git commit -m "Move reference CSS out of App.jsx"
          git push origin HEAD:main-test
