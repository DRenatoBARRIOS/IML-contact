name: IML continuity guard

on:
  push:
    branches:
      - main
    paths:
      - "api/countries.js"
      - "package.json"
      - "src/App.jsx"
      - "src/pages/SitePages.jsx"
      - "src/components/**"
      - "src/services/**"
      - "src/data/world-countries.json"
      - "vercel.json"
      - "tests/**"
      - ".github/workflows/continuity-guard.yml"
  pull_request:
    branches:
      - main
    paths:
      - "api/countries.js"
      - "package.json"
      - "src/App.jsx"
      - "src/pages/SitePages.jsx"
      - "src/components/**"
      - "src/services/**"
      - "src/data/world-countries.json"
      - "vercel.json"
      - "tests/**"
      - ".github/workflows/continuity-guard.yml"

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check continuity invariants
        run: npm run check

      - name: Build site
        run: npm run build
