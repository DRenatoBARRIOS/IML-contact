name: Phase 3 site config extraction

on:
  push:
    branches:
      - main-test
    paths:
      - .github/workflows/phase3-site-config-main-test.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Run phase 3 config extraction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-test
        uses: actions/checkout@v4
        with:
          ref: main-test
          fetch-depth: 0

      - name: Extract static site configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')

          import_line = 'import CountryExplorer from "./features/countries/CountryExplorer.jsx";\n'
          config_import = '''import {
            navigation,
            interoperabilityLayers,
            methodologyDomains,
            LEGACY_HASHES,
            LEGACY_PATHS,
          } from "./siteConfig.js";\n'''
          if './siteConfig.js' not in app:
              app = app.replace(import_line, import_line + config_import, 1)

          patterns = [
              r'\nconst navigation = \[.*?\n\];\n',
              r'\nconst interoperabilityLayers = \[.*?\n\];\n\nconst methodologyDomains = \[.*?\n\];\n',
              r'\nconst LEGACY_HASHES = \{.*?\n\};\n\nconst LEGACY_PATHS = \{.*?\n\};\n',
          ]
          for pattern in patterns:
              app, count = re.subn(pattern, '\n', app, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {pattern!r}, got {count}')

          app_path.write_text(app, encoding='utf-8')

          config = '''export const navigation = [
            { href: "/interoperability", label: "Interoperability" },
            { href: "/identity-trust", label: "Identity & Trust" },
            { href: "/clinical-workspace", label: "Clinical Workspace" },
            { href: "/country-profiles", label: "Country Profiles" },
            { href: "/manuscripts", label: "Manuscripts" },
            { href: "/collaborate", label: "Collaborate" },
          ];

          export const interoperabilityLayers = [
            ["01", "Technical", "Can systems exchange data reliably?"],
            ["02", "Semantic", "Is clinical meaning preserved?"],
            ["03", "Organisational", "Do workflows and responsibilities align?"],
            ["04", "Institutional", "Are governance, law and accountability credible?"],
            ["05", "Clinical & public health", "Does information improve decisions, safety and learning?"],
          ];

          export const methodologyDomains = [
            ["GOV", "Governance", "Stewardship, accountability and policy direction"],
            ["TEC", "Technical", "Standards, architecture and reliable exchange"],
            ["IDT", "Identity", "People, professionals, organisations and consent"],
            ["ADP", "Adoption", "Real use in care and public-health workflows"],
            ["SEC", "Security", "Protection, access control and resilience"],
            ["LRN", "Learning", "Feedback, correction and system improvement"],
          ];

          export const LEGACY_HASHES = {
            "#id4d": "/identity-trust",
            "#evaluation": "/interoperability",
            "#methodology": "/interoperability#methodology",
            "#world": "/country-profiles",
            "#profiles": "/country-profiles",
            "#contact": "/collaborate",
          };

          export const LEGACY_PATHS = {
            "/id4d": "/identity-trust",
            "/evaluation": "/interoperability",
            "/methodology": "/interoperability#methodology",
            "/world": "/country-profiles",
            "/profiles": "/country-profiles",
            "/contact": "/collaborate",
          };
          '''
          Path('src/siteConfig.js').write_text(config, encoding='utf-8')
          PY

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit refactor only
        shell: bash
        run: |
          rm .github/workflows/phase3-site-config-main-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/siteConfig.js .github/workflows/phase3-site-config-main-test.yml
          git commit -m "Extract static site configuration"
          git push origin main-test
