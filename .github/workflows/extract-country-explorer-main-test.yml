name: Extract CountryExplorer main-test

on:
  push:
    branches:
      - main-test
    paths:
      - .github/workflows/extract-country-explorer-main-test.yml

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message == 'Run CountryExplorer extraction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-test
        uses: actions/checkout@v4
        with:
          ref: main-test
          fetch-depth: 0

      - name: Extract CountryExplorer as one feature module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.jsx')
          app = app_path.read_text(encoding='utf-8')

          start_marker = 'const MAP_WIDTH = 1000;'
          end_marker = 'function HomePage() {'

          start = app.find(start_marker)
          end = app.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Country Explorer block markers not found or invalid.')

          block = app[start:end].rstrip()
          if 'function CountryExplorer()' not in block:
              raise SystemExit('CountryExplorer function is not inside the extracted block.')

          module = '''import { useEffect, useMemo, useState } from "react";\nimport worldCountries from "../../world-countries.json";\nimport logoImage from "../../assets/iml-logo.png";\n\n'''
          module += block.replace('function CountryExplorer() {', 'export default function CountryExplorer() {', 1)
          module += '\n'

          feature_path = Path('src/features/countries/CountryExplorer.jsx')
          feature_path.parent.mkdir(parents=True, exist_ok=True)
          feature_path.write_text(module, encoding='utf-8')

          app = app[:start] + app[end:]
          app = app.replace('import { useEffect, useMemo, useState } from "react";\n', 'import { useEffect } from "react";\n', 1)
          app = app.replace('import worldCountries from "./world-countries.json";\n', '', 1)

          import_line = 'import CountryExplorer from "./features/countries/CountryExplorer.jsx";\n'
          anchor = 'import heroLampImage from "./assets/hero-lamp-editorial.png";\n'
          if import_line not in app:
              if anchor not in app:
                  raise SystemExit('Import anchor not found.')
              app = app.replace(anchor, anchor + import_line, 1)

          if 'useMemo' in app or 'useState' in app:
              raise SystemExit('useMemo/useState still present in App.jsx after extraction; refusing unsafe rewrite.')
          if 'const MAP_WIDTH = 1000;' in app or 'function CountryExplorer()' in app:
              raise SystemExit('Country Explorer implementation still remains in App.jsx.')
          if app.count('<CountryExplorer />') != 1:
              raise SystemExit('Unexpected CountryExplorer render count in App.jsx.')

          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Commit extraction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/extract-country-explorer-main-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract CountryExplorer module"
          git push origin main-test
